services:
  db:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investix}
      POSTGRES_USER: ${POSTGRES_USER:-investix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - investix-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      INVESTIX_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-investix}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-investix}
      INVESTIX_SESSION_SECRET: ${INVESTIX_SESSION_SECRET:?Set INVESTIX_SESSION_SECRET in .env}
      INVESTIX_ADMIN_USERNAME: ${INVESTIX_ADMIN_USERNAME:-investix}
      INVESTIX_ADMIN_PASSWORD: ${INVESTIX_ADMIN_PASSWORD:?Set INVESTIX_ADMIN_PASSWORD in .env}
      INVESTIX_DEV_AUTH_BYPASS: ${INVESTIX_DEV_AUTH_BYPASS:-false}
      INVESTIX_TWELVE_DATA_API_KEY: ${INVESTIX_TWELVE_DATA_API_KEY:-}
      INVESTIX_WORKER_STATUS_FILE: /var/run/investix-worker/status.json
    volumes:
      - investix-worker-status:/var/run/investix-worker:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "0.0.0.0:8000:8000"

  worker:
    build: ./backend
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      INVESTIX_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-investix}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-investix}
      INVESTIX_SESSION_SECRET: ${INVESTIX_SESSION_SECRET:?Set INVESTIX_SESSION_SECRET in .env}
      INVESTIX_TWELVE_DATA_API_KEY: ${INVESTIX_TWELVE_DATA_API_KEY:-}
      INVESTIX_WORKER_STATUS_FILE: /var/run/investix-worker/status.json
    volumes:
      - investix-worker-status:/var/run/investix-worker
    command: python -m app.worker

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_started
    ports:
      - "0.0.0.0:5173:5173"

volumes:
  investix-postgres:
  investix-worker-status:
