[project]
name = "investix-api"
version = "0.5.0"
description = "Private portfolio management API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.0",
  "itsdangerous==2.2.0",
  "alembic==1.17.2",
  "pydantic-settings==2.12.0",
  "psycopg[binary]==3.2.13",
  "openpyxl==3.1.5",
  "sqlalchemy==2.0.45",
  "uvicorn[standard]==0.40.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
