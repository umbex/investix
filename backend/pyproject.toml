[project]
name = "investix-api"
version = "0.1.0"
description = "Private portfolio management API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.0",
  "pydantic-settings==2.12.0",
  "uvicorn[standard]==0.40.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
